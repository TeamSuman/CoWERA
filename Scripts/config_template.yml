# ===============================================================
# 🧬 CoWERA Simulation Input File
# ===============================================================
# This YAML file defines ALL parameters required to launch a
# CoWERA simulation.
#
# Launch command:
#     python run_cowera.py --config input.yaml
#
# ===============================================================



# =================================================================
# 🚀 CUDA GPU PERFORMANCE SETTINGS  (IMPORTANT)
# =================================================================
# ⚡ This simulation is intended to run on a GPU-enabled system.
#
# For optimal multi-walker performance, CUDA MPS (Multi-Process
# Service) is strongly recommended.
#
# ---------------------------------------------------------------
# 🟢 To enable CUDA MPS (run in terminal BEFORE launching):
#
#     nvidia-cuda-mps-control -d
#     export CUDA_MPS_ACTIVE_THREAD_PERCENTAGE=20
#
# Adjust the percentage based on GPU capacity.
# Example:
#   20% → for 5 parallel processes
#   10% → for 10 parallel processes
#
# Without MPS, performance may degrade significantly when running
# multiple walkers on a single GPU.
# =================================================================



# ===============================================================
# 🧬 SYSTEM INFORMATION
# ===============================================================
# Name of the molecular system.
system: "Trp-cage"

# Path to system directory.
# Must contain:
#   - system.py  (system creation logic)
#   - structure files (.gro, .top, .itp, etc.)
dir: "./Systems/TC10b Trp-cage"



# ===============================================================
# 🧪 SIMULATION SETUP
# ===============================================================

# Number of parallel trajectories (walkers)
num_walkers: 16

# Maximum allowed walker probability (prevents dominance)
pmax: 0.20

# Run label (used in output directory naming)
run: "test_0"

# MD steps between each resampling event
n_steps: 50000

# Total number of resampling cycles
n_cycles: 10000



# ===============================================================
# 📂 INPUT / OUTPUT FILES
# ===============================================================

# Starting coordinate file (.gro)
start: "folded.gro"

# Topology file (.top)
topol: "topol.top"

# Target structure (used for RMSD or direction reference)
# May be None if using best_hummer_q and direction implied.
target: "unfolded.gro"

# Native structure (used for contact-based metrics)
# May be None if sel_feat = "rmsd_backbone"
native: "folded.gro"



# ===============================================================
# 📊 FEATURE SELECTION
# ===============================================================

# Progress coordinate to monitor
# Options:
#   - "best_hummer_q"  (native contact fraction)
#   - "rmsd_backbone"  (Cα RMSD)
sel_feat: "best_hummer_q"

# Resampling decision strategy:
#   - "greedy"         → accept only improving moves
#   - "probabilistic"  → stochastic acceptance
mode: "probabilistic"

# Distance metric used between walkers:
#   - "pairwise_rmsd"
#   - "euclidean"      (distance in CV space)
distance_criterion: "euclidean"

# Initial intensity I0 form (paper Appendix C):
#   "projection" -> I0 is the min-max scaled projection (default, CoWERA)
#   "uniform"    -> I0 = 1 for all walkers
i0_mode: "projection"

# Include the coherence phase in the intensity (default true = CoWERA). Set false
# to reproduce the paper's proximity-only TARGETED-WE baseline (intensity = I0,
# i.e. resample purely by distance to the target, phase omitted).
use_phase: true



# ===============================================================
# 📏 DISTANCE THRESHOLDS
# ===============================================================

# Merge cutoff distance
# Walkers closer than this may merge
d_merge: 0.3

# Warping cutoff distance
# Defines boundary condition
d_warped: 0.3



# ===============================================================
# 🌡 THERMODYNAMIC SETTINGS
# ===============================================================

# Simulation temperature (Kelvin)
temp: 290.0



# ===============================================================
# 🖥  COMPUTE PLATFORM
# ===============================================================

# OpenMM compute platform. Default: "CUDA" (unchanged prior behaviour).
#   "CUDA"      → NVIDIA GPUs (requires gpu_ids)
#   "OpenCL"    → GPUs via OpenCL (requires gpu_ids)
#   "CPU"       → multithreaded CPU (no GPU; set n_workers)
#   "Reference" → single-thread reference CPU (slow; testing only)
platform: "CUDA"

# Optional OpenMM platform properties, e.g. {Precision: mixed} for CUDA or
# {Threads: "4"} for the CPU platform. Leave null for platform defaults.
platform_kwargs: null

# Number of concurrent walker worker processes for CPU/Reference platforms.
# Ignored for GPU platforms, where the number of workers is len(gpu_ids).
n_workers: 4

# EXPERIMENTAL (GPU only, default false): use persistent per-GPU workers that
# cache the OpenMM Context, instead of forking a process + rebuilding the Context
# for every walker every cycle (which recompiles kernels + re-uploads the system).
# Large multi-GPU speedup for short resampling intervals. Validate on your GPU
# host before production use; the default (false) keeps the process-per-task path.
persistent_workers: false


# ===============================================================
# 🎮 GPU CONFIGURATION
# ===============================================================

# List of GPU device IDs for CUDA/OpenCL execution (indexes the
# scheduler-VISIBLE devices; under SLURM/PBS CUDA_VISIBLE_DEVICES is
# renumbered 0..N-1). Repeat IDs to pack multiple walkers per GPU with MPS.
# Leave empty ([]) for CPU/Reference platforms.
#
# Example:
#   [0,0,0,0,0] → 5 walkers sharing GPU 0 via MPS
#
gpu_ids: [0, 0, 0, 0, 0]



# ===============================================================
# 💾 DATA COLLECTION SETTINGS
# ===============================================================

# Frequency (MD steps) to save trajectory data
save_freq: 5000

# Advanced: which OpenMM state fields to pull off the GPU each segment. Default
# (positions + velocities only) minimizes GPU->CPU transfer since reporters save
# just positions + box. Override only if you need e.g. forces/energy saved:
#   getstate_kwargs: {getPositions: true, getVelocities: true, getForces: true,
#                     getEnergy: true, getParameters: false, getParameterDerivatives: false}
getstate_kwargs: null

# Number of bins for progress coordinate discretization
n_bins: 122

# Maximum allowed bins (dynamic adjustment cap)
max_bins: 122


# ===============================================================
# 💾 CHECKPOINT / RESTART
# ===============================================================

# Write a checkpoint (walker states + cycle index + adaptive bin count) every
# this many cycles. Enables `--restart`. Larger values reduce I/O; smaller
# values lose less work if a job is killed. Default: 10.
checkpoint_freq: 10

# Write a per-cycle wall-clock breakdown to <output>/profile.csv (propagation vs
# resampling analysis vs warp vs work-mapper overhead). For performance profiling;
# leave false for production. Pair with Scripts/tools/gpu_monitor.py for GPU util.
profile: false

# Resume from the newest checkpoint in the output directory instead of starting
# fresh. Equivalent to passing --restart on the command line. On restart the
# output directory, trajectories and results file are preserved (never clobbered)
# and the per-walker CV histories rebuild from the saved walker_*.dcd files.
restart: false



# ===============================================================
# 🔁 FOLDING / UNFOLDING MODE
# ===============================================================

# Direction indicator:
#   +1 → increasing coordinate (folding for Q)
#   -1 → decreasing coordinate (folding for RMSD)
increment: -1



# ===============================================================
# ⚙️  RESAMPLING PERFORMANCE (optional; Phase 2)
# ===============================================================

# Random seed for the resampler's clone/merge decisions. null => nondeterministic.
# Set an integer to make resampling decisions reproducible run-to-run.
seed: null

# When true, derive each MD segment's integrator seed deterministically from
# (seed, cycle, walker) instead of OpenMM's default 0 (which re-randomizes each
# segment). NOTE: GPU MD is not bitwise reproducible even so; this gives
# controlled-but-not-identical dynamics. Default false (preserves prior behaviour).
deterministic_dynamics: false

# Use the in-memory CV history for the coherence analysis instead of
# re-reading and re-projecting each walker's full DCD trajectory every
# cycle. Default: true. Set to false to use the legacy disk-based path.
use_cv_history: true

# Optional cap on the retained per-walker CV history length (number of
# saved frames). Bounds the changepoint-detection cost for very long
# walkers. Leave as null for unbounded (full) history (paper-faithful).
history_window: null

# P3b: cap the CV history the changepoint detector sees to the most recent
# N frames, so KernelCPD is O(N^2) per walker instead of O(T^2) growing with
# the run (the dominant CPU cost at scale). Only the most recent changepoint
# (the current phase boundary) is used, so a window >= the relevant-history
# length reproduces the unbounded result. null = unbounded/exact (default).
changepoint_window: null

# A2: read ONLY the new frames from each walker's DCD each cycle (random access)
# instead of md.load()ing the whole growing trajectory -> O(new) not O(total), the
# dominant growing CPU cost. Numerically identical (verified bit-identical on both
# feature paths); on any error it falls back to the full load. Default true; set
# false to force the exact full-load path.
incremental_cv_read: true
# When true, also recompute the full-load projection and assert it matches the
# incremental one (validation; slower). Use to certify a new system, then disable.
verify_incremental_cv: false

# Adaptive-bin adjustment factors (paper Appendix F). When <20% of bins are
# visited, n_bins *= bin_increase_factor; when >80%, n_bins *= bin_decrease_factor.
# Defaults 1.2 / 0.8 match the code's historical behaviour. NOTE: the manuscript
# text states 1.5 / 0.75 -- set these to reproduce the paper exactly (decision D-1).
bin_increase_factor: 1.2
bin_decrease_factor: 0.8



# ===============================================================
# 📁 OUTPUT CONFIGURATION
# ===============================================================

# Subdirectory inside system DIR to store results
output_folder: "unfolding_runs"

# Optional node-local scratch directory for the high-churn per-walker trajectory
# (DCD) I/O; synced back to the output directory on exit. **Strongly recommended on
# clusters where the output dir is on a shared/NFS filesystem** — writing DCD frames
# to NFS during propagation hits variable latency that STALLS the compute loop
# (measured: ~27% of MD cycles spiked to ~2.7x median; node-local scratch cut that
# to ~7% and the mean cycle time ~29%). Env vars are expanded, so use a per-job,
# collision-free path. Solaris/PBS example: "/tmp/$USER/cowera_$PBS_JOBID" (/tmp is
# 125G local ext4; /scratch is root-only there; avoid /dev/shm for large runs — RAM).
# Checkpoints + the results file stay on the output dir so restarts still work.
# Leave null to write trajectories directly to output_folder.
scratch_dir: null