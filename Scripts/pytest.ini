[pytest]
# The default `python -m pytest Scripts/tests/` run stays fast and dependency-light:
# it exercises only the pure-numpy algorithm cores. Integration tests that need the
# full MD stack (OpenMM / mdtraj / ruptures) are marked `integration` and excluded by
# default; run them explicitly with `-m integration` on a host that has the stack.
addopts = -m "not integration"
markers =
    integration: end-to-end tests that require the OpenMM/mdtraj/ruptures MD stack (deselected by default)
